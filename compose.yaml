services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_CACHE: /models
    volumes:
      - embedding_cache:/models
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - qdrant
  ui:
    build: .
    command: streamlit run repopilot/ui.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      - api
volumes:
  qdrant_data:
  embedding_cache:
