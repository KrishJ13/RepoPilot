services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
  ui:
    build: .
    command: streamlit run repopilot/ui.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
